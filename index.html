<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>祈年殿 — 天坛祈年殿 three.js 重建</title>
  <!-- 提供 favicon 可消除浏览器对 /favicon.ico 的隐式 404 探测。
       截图门禁已显式忽略该探测，但它会让 playwright-cli 的人工评审每次都显示
       "Console: 1 errors"，容易被误读为页面故障，故补上。 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<!-- 注意：此处不要放占位 <canvas>。渲染器自己会创建并 append canvas；
     若这里再留一个，它会在正常文档流里占位并把真实 canvas 挤下约 150px，
     截图顶部会出现一条白边（已实测踩过）。 -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
